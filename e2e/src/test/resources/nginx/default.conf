# Reverse proxy sitting in front of the backend, exposing it to the browser under
# two hostnames (`api` and `dav`) and adding the CORS headers the SPA needs.
#
# The SPA is served from http://frontend while the API lives on http://api: this is
# the very same cross origin topology as a real deployment, so CORS regressions are
# caught here rather than in production.

resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api;

    # Upstream resolved at request time so nginx boots even if the backend is not up yet
    set $side_service "twake-calendar-side-service:8080";

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE, REPORT, PROPFIND, PROPPATCH, MKCOL, MKCALENDAR, COPY, MOVE, LOCK, UNLOCK, ACL' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Authorization, Accept, Depth, Destination, Prefer, If-Match, If-None-Match, Overwrite, X-Http-Method-Override' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'ETag, Location, Content-Type' always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_pass http://$side_service$request_uri;
    }
}

server {
    listen 80;
    server_name dav;

    set $sabre "esn_sabre:80";

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE, REPORT, PROPFIND, PROPPATCH, MKCOL, MKCALENDAR, COPY, MOVE, LOCK, UNLOCK, ACL' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Authorization, Accept, Depth, Destination, Prefer, If-Match, If-None-Match, Overwrite, X-Http-Method-Override' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;

        proxy_pass http://$sabre$request_uri;
    }
}

# Anything else: fail loudly rather than silently proxying to the wrong place
server {
    listen 80 default_server;
    server_name _;
    return 421;
}
